<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <title>Keeping Tabs</title>

  <!-- The app icon: the wordmark reduced to its initials. One source for
       apple-touch-icon (180), icon-192 and icon-512 - every size a launcher
       asks for is big enough to read a single letter, which is exactly what
       favicon.svg is not, and why that one carries no letters at all.

       Full bleed and no rounded outer corners: iOS and Android apply their
       own mask, and a pre-rounded icon shows its corners inside theirs.
       Both letters sit inside the maskable safe zone - the circle of radius
       40% of the canvas that a maskable icon is guaranteed to keep - so this
       one file serves purpose "any" and "maskable" alike. -->

  <defs>
    <path id="back"  d="M60,96 A20,20 0 0 1 80,76 L264,76 A20,20 0 0 1 284,96 L284,572 L60,572 Z"/>
    <path id="front" d="M224,272 A20,20 0 0 1 244,252 L428,252 A20,20 0 0 1 448,272 L448,572 L224,572 Z"/>
    <clipPath id="cb"><use href="#back"/></clipPath>
    <clipPath id="cf"><use href="#front"/></clipPath>
    <filter id="lift" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="14" flood-color="#000" flood-opacity=".5"/>
    </filter>
  </defs>

  <rect width="512" height="512" fill="#14181A"/>

  <g>
    <use href="#back" fill="#007EED"/>
    <g clip-path="url(#cb)">
      <rect x="60" y="76" width="224" height="4" fill="#fff" opacity=".20"/>
      <rect x="60" y="76" width="4" height="496" fill="#fff" opacity=".07"/>
      <rect x="280" y="76" width="4" height="496" fill="#000" opacity=".20"/>
    </g>
    <text x="172" y="225" fill="#fff" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="170" font-weight="700">K</text>
  </g>

  <g filter="url(#lift)">
    <use href="#front" fill="#FB1900"/>
    <g clip-path="url(#cf)">
      <rect x="224" y="252" width="224" height="4" fill="#fff" opacity=".20"/>
      <rect x="224" y="252" width="4" height="320" fill="#fff" opacity=".07"/>
      <rect x="444" y="252" width="4" height="320" fill="#000" opacity=".20"/>
    </g>
    <text x="336" y="401" fill="#fff" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="170" font-weight="700">T</text>
  </g>
</svg>
