<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Keeping Tabs</title>
  <desc>Two overlapping tabs rising from the bottom edge on a dark ground: a blue one reading "Keeping" behind, a red one reading "Tabs" in front and lower.</desc>

  <!-- 1200x630 is the Open Graph standard, and 1.91:1 so Twitter's large
       card crops nothing. Both words sit well inside the middle band, so a
       platform that crops to 2:1 still gets the whole wordmark. -->

  <defs>
    <!-- Rounded at the top only, running off the bottom edge: these are the
         app's own tabs, which are anchored to a screen edge and protrude
         inward. A tab with four rounded corners would be a card. -->
    <path id="tabBack"  d="M190,126 A30,30 0 0 1 220,96 L780,96 A30,30 0 0 1 810,126 L810,660 L190,660 Z"/>
    <path id="tabFront" d="M520,330 A30,30 0 0 1 550,300 L920,300 A30,30 0 0 1 950,330 L950,660 L520,660 Z"/>

    <clipPath id="clipBack"><use href="#tabBack"/></clipPath>
    <clipPath id="clipFront"><use href="#tabFront"/></clipPath>

    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="22" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#14181A"/>

  <!-- The app's bevel, drawn per tab: a light top edge, a fainter light left
       edge, a dark right edge, clipped to the rounded shape. No shading across
       the face — darkening a tab costs color separation, and color is how a
       player finds their own tab across a table. -->

  <!-- Behind: Keeping -->
  <g>
    <use href="#tabBack" fill="#007EED"/>
    <g clip-path="url(#clipBack)">
      <rect x="190" y="96"  width="620" height="3"   fill="#fff" opacity=".20"/>
      <rect x="190" y="96"  width="3"   height="564" fill="#fff" opacity=".07"/>
      <rect x="807" y="96"  width="3"   height="564" fill="#000" opacity=".20"/>
    </g>
    <text x="500" y="243" fill="#fff" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="104" font-weight="700" letter-spacing="-2">Keeping</text>
  </g>

  <!-- In front and lower: Tabs -->
  <g filter="url(#lift)">
    <use href="#tabFront" fill="#FB1900"/>
    <g clip-path="url(#clipFront)">
      <rect x="520" y="300" width="430" height="3"   fill="#fff" opacity=".20"/>
      <rect x="520" y="300" width="3"   height="360" fill="#fff" opacity=".07"/>
      <rect x="947" y="300" width="3"  height="360" fill="#000" opacity=".20"/>
    </g>
    <text x="735" y="447" fill="#fff" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif"
          font-size="104" font-weight="700" letter-spacing="-2">Tabs</text>
  </g>
</svg>
