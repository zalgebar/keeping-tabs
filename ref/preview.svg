<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>Keeping Tabs</title>
  <desc>Two overlapping tabs rising from the bottom edge on a dark ground: a blue one reading "Keeping" behind, a red one reading "Tabs" in front and lower.</desc>

  <!-- Tabs are rounded at the top only and run off the bottom edge, because
       that is what the app's tabs are: anchored to a screen edge, protruding
       inward. Four rounded corners would make them cards, which is the one
       thing they must not look like.

       Tab widths are the word plus 44px each side, measured rather than
       guessed - "Keeping" is 3.593 and "Tabs" 2.061 times the font
       size in this face at letter-spacing -2. Padding that tight is what
       lets the whole card survive being shrunk to a chat thumbnail. -->

  <defs>
    <path id="back"  d="M110,95 A31,31 0 0 1 141,64 L771,64 A31,31 0 0 1 802,95 L802,690 L110,690 Z"/>
    <path id="front" d="M640,336 A20,20 0 0 1 660,316 L1054,316 A20,20 0 0 1 1074,336 L1074,690 L640,690 Z"/>
    <clipPath id="cb"><use href="#back"/></clipPath>
    <clipPath id="cf"><use href="#front"/></clipPath>
    <!-- Spelled out as primitives rather than as feDropShadow. Inkscape does
         not implement that shorthand, and an element carrying a filter it
         cannot resolve renders as nothing at all - which silently took the
         front tab and its word with it, in the one renderer that matters for
         exporting. Browsers and macOS handled it, so it looked fine
         everywhere it was checked. -->
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="24" result="blur"/>
      <feOffset in="blur" dy="14" result="cast"/>
      <feFlood flood-color="#000" flood-opacity=".55" result="ink"/>
      <feComposite in="ink" in2="cast" operator="in" result="shadow"/>
      <feMerge>
        <feMergeNode in="shadow"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="630" fill="#14181A"/>

  <!-- The app's own bevel: light top edge, fainter light left edge, dark
       right edge, clipped to the rounded shape. Nothing shades the face -
       darkening a tab costs color separation, and color is how a player
       finds their own tab across a table. -->
  <g>
    <use href="#back" fill="#007EED"/>
    <g clip-path="url(#cb)">
      <rect x="110" y="64" width="692" height="4" fill="#fff" opacity=".20"/>
      <rect x="110" y="64" width="4" height="626" fill="#fff" opacity=".07"/>
      <rect x="798" y="64" width="4" height="626" fill="#000" opacity=".20"/>
    </g>
    <text x="456" y="228" fill="#fff" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="168" font-weight="700" letter-spacing="-2">Keeping</text>
  </g>

  <g filter="url(#lift)">
    <use href="#front" fill="#FB1900"/>
    <g clip-path="url(#cf)">
      <rect x="640" y="316" width="434" height="4" fill="#fff" opacity=".20"/>
      <rect x="640" y="316" width="4" height="374" fill="#fff" opacity=".07"/>
      <rect x="1070" y="316" width="4" height="374" fill="#000" opacity=".20"/>
    </g>
    <text x="857" y="480" fill="#fff" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="168" font-weight="700" letter-spacing="-2">Tabs</text>
  </g>
</svg>
