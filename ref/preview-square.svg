<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200">
  <title>Keeping Tabs</title>
  <desc>Two overlapping tabs rising from the bottom edge on a dark ground: a blue one reading "Keeping" behind, a red one reading "Tabs" in front and lower.</desc>

  <!-- Tabs are rounded at the top only and run off the bottom edge, because
       that is what the app's tabs are: anchored to a screen edge, protruding
       inward. Four rounded corners would make them cards, which is the one
       thing they must not look like.

       Tab widths are the word plus 48px each side, measured rather than
       guessed - "Keeping" is 3.593 and "Tabs" 2.061 times the font
       size in this face at letter-spacing -2. Padding that tight is what
       lets the whole card survive being shrunk to a chat thumbnail. -->

  <defs>
    <path id="back"  d="M110,237 A37,37 0 0 1 147,200 L888,200 A37,37 0 0 1 925,237 L925,1260 L110,1260 Z"/>
    <path id="front" d="M590,643 A23,23 0 0 1 613,620 L1075,620 A23,23 0 0 1 1098,643 L1098,1260 L590,1260 Z"/>
    <clipPath id="cb"><use href="#back"/></clipPath>
    <clipPath id="cf"><use href="#front"/></clipPath>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="24" flood-color="#000" flood-opacity=".55"/>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="#14181A"/>

  <!-- The app's own bevel: light top edge, fainter light left edge, dark
       right edge, clipped to the rounded shape. Nothing shades the face -
       darkening a tab costs color separation, and color is how a player
       finds their own tab across a table. -->
  <g>
    <use href="#back" fill="#007EED"/>
    <g clip-path="url(#cb)">
      <rect x="110" y="200" width="815" height="4" fill="#fff" opacity=".20"/>
      <rect x="110" y="200" width="4" height="1060" fill="#fff" opacity=".07"/>
      <rect x="921" y="200" width="4" height="1060" fill="#000" opacity=".20"/>
    </g>
    <text x="517" y="391" fill="#fff" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="200" font-weight="700" letter-spacing="-2">Keeping</text>
  </g>

  <g filter="url(#lift)">
    <use href="#front" fill="#FB1900"/>
    <g clip-path="url(#cf)">
      <rect x="590" y="620" width="508" height="4" fill="#fff" opacity=".20"/>
      <rect x="590" y="620" width="4" height="640" fill="#fff" opacity=".07"/>
      <rect x="1094" y="620" width="4" height="640" fill="#000" opacity=".20"/>
    </g>
    <text x="844" y="811" fill="#fff" text-anchor="middle"
          font-family="-apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif" font-size="200" font-weight="700" letter-spacing="-2">Tabs</text>
  </g>
</svg>
