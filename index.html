<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark light">
<!-- apple-mobile-web-app-capable + viewport-fit=cover is what makes iOS
     report real safe-area insets in standalone; without it env() reads 0.
     The status bar is deliberately NOT black-translucent: translucent moves
     the viewport origin up under the status bar without growing its height,
     leaving an unpaintable black band along the bottom. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Keeping Tabs</title>
<style>
  /* ============================================================
     M3 - Rounds
     Players, the event log as source of truth, the adjustment pad,
     global undo, localStorage autosave.

     Two zones, and the rule that separates them:
       scoring - edge-anchored, rotated, NO native inputs
       setup   - centre, unrotated, native inputs fine
     A rotated <input> puts the iOS keyboard against a 90-degree field.
     ============================================================ */

  :root {
    --depth: 80px;
    --ground: #14181A;
    --ink: #E8EDEA;
    --ink-dim: #8C9A94;
    --hub: #1D2326;
    --rule: #2C3438;
    --accent: #E08A4C;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; height: 100%; overflow: hidden;
    overscroll-behavior: none;
    background: var(--ground); color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none; user-select: none; -webkit-user-select: none;
  }

  #probe {
    position: fixed; top: 0; left: 0; width: 1px; height: 1px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    opacity: 0; pointer-events: none; z-index: -1;
  }
  /* Measures what the page can actually paint - innerHeight lies in iOS
     standalone. A fixed inset:0 box IS the layout viewport. */
  #vp { position: fixed; inset: 0; pointer-events: none; z-index: -2; }

  /* ---------------- centre ---------------- */

  /* Explicit order at the root, or DOM order decides it: #centre would
     paint over an expanding panel, and #stage would paint over nothing.
     Inside #stage: tabs 0, lifted 10, scrim 20, open panel 30. */
  #centre {
    position: fixed; z-index: 1;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 12px;
    padding: 12px; text-align: center;
  }
  .hub {
    background: var(--hub); border: 1px solid var(--rule); border-radius: 12px;
    padding: 14px; display: flex; flex-direction: column; gap: 10px;
    min-width: 0; max-width: min(320px, 100%);
  }
  .hub h1 {
    margin: 0; font-size: 12px; font-weight: 600; letter-spacing: .16em;
    text-transform: uppercase; color: var(--ink-dim);
  }
  .lead { font-size: 13px; color: var(--ink-dim); line-height: 1.5; }
  .tiny {
    font: 11px/1.4 ui-monospace, SFMono-Regular, Menlo, monospace;
    background: none; border: 0; color: #59635E; cursor: pointer; padding: 2px;
  }
  .diagbox {
    display: none; font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink-dim); text-align: left; white-space: pre-wrap;
    background: #14191B; border: 1px solid var(--rule); border-radius: 8px; padding: 8px;
  }
  .diagbox.on { display: block; }
  .diagbox b { color: var(--ink); font-weight: 600; }
  .warn { color: #E5A25C; }
  .lead b { color: var(--ink); font-weight: 600; }

  .btn {
    font: inherit; font-size: 14px; padding: 9px 8px; border-radius: 8px;
    background: #262E31; color: var(--ink); border: 1px solid var(--rule);
    cursor: pointer; min-height: 40px;
    /* three of these share one row inside a centre that is only ~222px
       wide on a phone, so they must be allowed to shrink */
    min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .btn:disabled { opacity: .38; }
  .btn.primary { background: var(--accent); color: #1A1005; border-color: var(--accent); font-weight: 600; }
  .btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .btns { display: flex; gap: 8px; }
  /* Two side by side get less room than a full-width one. */
  .btns .btn { flex: 1 1 0; font-size: 13px; padding-left: 4px; padding-right: 4px; }

  .seg { display: flex; gap: 4px; }
  .seg button {
    flex: 1; padding: 7px 8px; font: inherit; font-size: 12px;
    background: #262E31; color: var(--ink-dim);
    border: 1px solid var(--rule); border-radius: 6px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: var(--accent); color: #1A1005; border-color: var(--accent); font-weight: 600; }

  /* ---------------- tabs ---------------- */

  #stage { position: fixed; inset: 0; pointer-events: none; z-index: 2; }
  /* Saturated tabs on black read as the game rather than the scorepad
     beside it. Idle, the whole app desaturates and sinks back; any touch
     wakes it. Filtering the two containers rather than each tab keeps it
     to two composited layers, and it cannot fight the per-tab filter the
     lifted state uses. The hub is included or it becomes the brightest
     thing on the table while everything else recedes. */
  #stage, #centre { transition: filter .7s ease; }
  body.ambient #stage, body.ambient #centre { filter: saturate(.3) brightness(.62); }

  .tab {
    position: absolute; top: 0; left: 0; transform-origin: 0 0;
    pointer-events: auto; cursor: grab; color: #fff;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 1px; overflow: hidden;
    border-radius: 12px 12px 0 0;
    padding: 7px 0 17px;
    transition: box-shadow .18s ease, filter .18s ease;
    /* local y=0 is the INWARD edge, y=depth is the OUTER edge */
  }
  /* Bevel finish, on an overlay rather than the tab's own box-shadow which
     the lift state owns. No shadow at the bezel: darkening the lower half
     costs colour separation, and colour is a player identifier. */
  .tab::after {
    content: ""; position: absolute; inset: 0;
    border-radius: inherit; pointer-events: none;
    box-shadow: inset 0 2px 0 rgba(255,255,255,.20),
                inset 2px 0 0 rgba(255,255,255,.07),
                inset -2px 0 0 rgba(0,0,0,.20);
  }
  .tab.lifted { cursor: grabbing; filter: brightness(1.14); box-shadow: 0 0 0 2px #fff8, 0 8px 24px #0009; z-index: 10; }
  .tab.settling { transition: transform .22s cubic-bezier(.2,.9,.3,1), width .22s cubic-bezier(.2,.9,.3,1), height .22s cubic-bezier(.2,.9,.3,1), box-shadow .18s ease, filter .18s ease; }
  .tab.open { z-index: 30; box-shadow: 0 10px 40px #000b; cursor: default; }

  .tab .name { display: flex; align-items: baseline; gap: 5px; max-width: 100%; padding: 0 8px; line-height: 1; }
  .tab .emoji { font-size: 22px; line-height: 1; }
  .tab .who { font-size: 17px; font-weight: 600; letter-spacing: .01em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tab .nums { display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; line-height: 1; }
  .tab .tot { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }

  .tab.t-first .who { max-width: 8ch; }
  .tab.t-emoji .who { display: none; }
  .tab.t-emoji .emoji { font-size: 24px; }

  /* Two markers, matched to signal strength. The star is the more
     visible mark and carries the more important signal: the lead. The bar
     is quieter and takes the secondary one, the last round's winner.
     Opposite edges of the tab, so one player can hold both. */
  .tab .star { position: absolute; bottom: calc(2px + var(--bleed, 0px)); font-size: 13px; line-height: 1; display: none; color: #FFD98A; }
  .tab.leading .star { display: block; }
  .tab .bar { position: absolute; top: 3px; left: 14%; right: 14%; height: 4px;
              border-radius: 2px; background: #FFD98A; display: none; }
  .tab.won-round .bar { display: block; }
  .tab .rnd { font-size: 16px; opacity: .78; }
  .tab.t-emoji .rnd { display: none; }

  /* ---------------- expanded panel (the tab, grown) ---------------- */

  /* display:contents so the compact rows participate in the tab's own
     flex column. Must be a rule, not an inline style, or it outranks
     the hide-when-open below. */
  .tab .compact { display: contents; }
  .tab.open .compact { display: none; }
  .panel { display: none; }
  .tab.open .panel {
    display: flex; flex-direction: column; gap: 6px;
    width: 100%; height: 100%; padding: 8px 12px calc(10px + var(--bleed, 0px));
    align-items: stretch; min-height: 0;
  }
  .panel .ptop { display: flex; align-items: center; gap: 8px; flex: none; line-height: 1; }
  .panel .pname { font-size: 17px; font-weight: 700; flex: 1; text-align: left; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .panel .ptot { font-size: 32px; font-weight: 700; letter-spacing: -.02em;
                 font-variant-numeric: tabular-nums; line-height: 1; }
  /* The pending delta, shown the way a tab shows round-then-total. */
  .panel .pend { font-size: 17px; font-weight: 600; opacity: .85; font-variant-numeric: tabular-nums; }
  .panel .x.ok { background: rgba(255,255,255,.30); font-weight: 700; }
  .panel .x {
    width: 34px; height: 34px; border-radius: 8px; border: 0; cursor: pointer;
    background: rgba(0,0,0,.28); color: #fff; font-size: 17px; line-height: 1;
  }
  /* Both grids flex to fill the panel rather than stacking to a fixed
     height. A fixed stack overflowed on a side panel, and `overflow:
     hidden` quietly clipped the confirm button. */
  .pad { display: grid; grid-template-columns: repeat(3, 1fr);
         grid-template-rows: repeat(2, minmax(0, 1fr)); gap: 6px; flex: 1; min-height: 0; }
  .pad button {
    font: inherit; font-size: 26px; font-weight: 700; padding: 6px 0; min-height: 40px;
    border-radius: 9px; border: 0; cursor: pointer;
    background: rgba(255,255,255,.16); color: #fff;
    font-variant-numeric: tabular-nums;
  }
  .pad button.minus { background: rgba(0,0,0,.26); }
  .pad button:active { background: rgba(255,255,255,.34); }
  /* Confirm lives here, a full row away from the digits. Moving it to the
     other end of the header would not have helped: the fault is reach,
     not eyesight, and both top corners are where thumbs already are. */
  .prow { display: grid; grid-template-columns: 1fr 1fr 1fr 1.35fr;
          gap: 6px; align-items: stretch; flex: none; }
  .prow .btn2 {
    font: inherit; font-size: 15px; padding: 6px 4px; min-height: 54px;
    border-radius: 9px; border: 0; cursor: pointer;
    background: rgba(0,0,0,.24); color: #fff;
  }
  .prow .btn2:disabled { opacity: .4; }
  .prow .btn2.ok { background: rgba(255,255,255,.34); font-size: 26px; font-weight: 700; }

  /* Per-player type size, because hands differ around one table. */
  .tab.size-large .pad button    { font-size: 32px; }
  .tab.size-large .keys button   { font-size: 34px; }
  .tab.size-large .prow .btn2    { font-size: 17px; }
  .tab.size-large .prow .btn2.ok { font-size: 30px; }
  .tab.size-large .panel .ptot   { font-size: 36px; }
  .hist { font-size: 12px; color: rgba(255,255,255,.72); font-variant-numeric: tabular-nums;
          white-space: nowrap; overflow: hidden; text-overflow: ellipsis; text-align: left; min-height: 1.3em; }

  /* keypad - drawn, never a native input, because the panel is rotated */
  .keys { display: grid; grid-template-columns: repeat(3, 1fr);
          grid-template-rows: repeat(4, minmax(0, 1fr)); gap: 6px; flex: 1; min-height: 0; }
  .keys button {
    font: inherit; font-size: 28px; font-weight: 600; padding: 4px 0; min-height: 34px;
    border-radius: 9px; border: 0; cursor: pointer;
    background: rgba(255,255,255,.14); color: #fff; font-variant-numeric: tabular-nums;
  }
  .entry { font-size: 26px; font-weight: 700; text-align: right; font-variant-numeric: tabular-nums;
           line-height: 1.15; padding-right: 4px; flex: none; }
  /* Confirm lives on the INWARD edge, never the outer one: the bottom of a
     panel is where the bleed and the home indicator are. */


  /* Inside #stage, not beside it. `position: fixed` on #stage creates a
     stacking context, so an open tab's z-index only competes with its
     siblings — a scrim outside #stage paints over every tab no matter
     what z-index the tab carries. */
  #scrim { position: fixed; inset: 0; background: #000; opacity: 0; pointer-events: none;
           transition: opacity .2s ease; z-index: 20; }
  #scrim.on { opacity: .55; pointer-events: auto; }

  /* ---------------- sheet (centre, unrotated) ---------------- */

  #sheet {
    position: fixed; z-index: 40; left: 50%; top: 50%; transform: translate(-50%,-50%);
    width: min(360px, calc(100% - 32px)); max-height: min(560px, calc(100% - 40px));
    background: var(--hub); border: 1px solid var(--rule); border-radius: 14px;
    padding: 14px; display: none; flex-direction: column; gap: 10px;
    overflow: auto; touch-action: pan-y;
  }
  #sheet.on { display: flex; }
  #sheet h2 { margin: 0; font-size: 12px; letter-spacing: .16em; text-transform: uppercase; color: var(--ink-dim); }
  .plist { display: flex; flex-direction: column; gap: 6px; }
  .prow2 { display: flex; align-items: center; gap: 8px; background: #232A2D; border-radius: 9px; padding: 6px 8px; }
  /* Emoji doubles as the colour swatch: one control shows both. */
  .prow2 .emo {
    width: 42px; height: 42px; flex: none; border-radius: 9px; border: 0;
    text-align: center; font-size: 21px; line-height: 1; color: #fff;
    padding: 0; cursor: pointer;
  }
  .prow2 .col {
    width: 34px; height: 34px; flex: none; padding: 0; cursor: pointer;
    border: 1px solid var(--rule); border-radius: 8px; background: transparent;
  }
  .prow2 .col::-webkit-color-swatch-wrapper { padding: 2px; }
  .prow2 .col::-webkit-color-swatch { border: 0; border-radius: 6px; }
  .prow2 input {
    flex: 1; min-width: 0; font: inherit; font-size: 15px; color: var(--ink);
    background: transparent; border: 0; border-bottom: 1px solid var(--rule); padding: 5px 2px;
    user-select: text; -webkit-user-select: text;
  }
  .prow2 input:focus { outline: none; border-bottom-color: var(--accent); }
  .gridwrap { overflow: auto; max-height: 46vh; border: 1px solid var(--rule); border-radius: 9px; }
  table.rounds { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
  table.rounds th, table.rounds td {
    padding: 6px 8px; text-align: right; font-size: 13px; white-space: nowrap;
    border-bottom: 1px solid var(--rule);
  }
  table.rounds th { position: sticky; top: 0; background: #232A2D; font-size: 15px; }
  table.rounds .rn { text-align: left; color: var(--ink-dim); font-size: 12px; }
  table.rounds tr.live td { color: var(--accent); }
  table.rounds tr.tot td { font-weight: 700; border-bottom: 0; }
  table.rounds tr.tot { background: #232A2D; }
  .setting { display: flex; align-items: center; justify-content: space-between; gap: 10px; padding: 2px; }
  .setting span { font-size: 13px; color: var(--ink-dim); }
  .setting .seg { flex: 0 0 auto; width: 132px; }
  .prow2 .tsize {
    width: 34px; height: 34px; flex: none; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--rule); background: #262E31; color: var(--ink);
    font-weight: 700; line-height: 1; font-size: 15px;
  }
  .prow2 .kill { width: 34px; height: 34px; border-radius: 8px; border: 0; cursor: pointer;
                 background: transparent; color: var(--ink-dim); font-size: 17px; }

  @media (prefers-reduced-motion: reduce) {
    .tab, .tab.settling, #scrim { transition: none; }
  }
</style>
</head>
<body>

<div id="probe"></div>
<div id="vp"></div>
<div id="stage">
  <div id="scrim"></div>
</div>

<div id="centre">
  <div class="hub">
    <h1>Keeping Tabs</h1>
    <div class="lead" id="lead"></div>
    <button class="btn primary" id="endRound">End round</button>
    <div class="btns">
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="rounds">Rounds</button>
    </div>
    <button class="btn" id="manage">Players</button>
    <div class="seg" id="arrange">
      <button data-arrange="off" aria-pressed="true">Locked</button>
      <button data-arrange="on" aria-pressed="false">Arrange</button>
    </div>
    <button class="tiny" id="diagToggle"></button>
    <div class="diagbox" id="diagbox"></div>
  </div>
</div>

<div id="sheet"></div>

<script>
"use strict";

/* ============================================================
   Constants
   ============================================================ */

const DEPTH   = 80;
const PAD_OUT = 17;
const GAP     = 6;
const MIN_LEN = 60;
const MAX_LEN = 200;
/* Tabs deliberately do NOT fill their edge - zero slack means a neighbour
   can never slide out of the way, only snap when the sort order flips. */
const FILL    = 0.92;
/* iOS standalone with an opaque status bar reports no bottom inset yet the
   page still runs under the home indicator. Apple's own values. */
const HOME_BAR_PHONE  = 34;
const HOME_BAR_TABLET = 20;
const HOLD_MS = 350;
const SLOP    = 8;
const MAX_PLAYERS = 16;
const AMBIENT_MS = 20000;   // idle before the tabs sink back
const STORE = "keepingtabs.state";
/* Date-sequence, bumped by hand each commit, so a screenshot identifies
   its own build. Not a commit hash: a commit cannot contain its own hash,
   and amending one in only ever leaves it pointing at the commit before.
   The commit message names the build, so `git log --grep` maps it back. */
const BUILD = "0830-9";

/* Whether this context can persist at all. Private mode, a data: URL and
   a full quota all throw, and the app has to keep working regardless. */
let storageOk = null;
let lastSave  = "never";
function probeStorage() {
  try { localStorage.setItem("kt.probe", "1"); localStorage.removeItem("kt.probe"); storageOk = true; }
  catch (e) { storageOk = false; }
}

const EDGES = ["top", "right", "bottom", "left"];

/* Defaults only. Players may type any emoji they like, including ones
   that will not render everywhere — that is their call, not ours. This
   pool just picks sensible starting animals: distinct silhouettes at
   20px, nothing newer than Unicode 9.0 so it renders on older devices. */
const ANIMALS = ["\u{1F98A}","\u{1F419}","\u{1F989}","\u{1F422}","\u{1F427}","\u{1F98B}","\u{1F41D}","\u{1F40C}",
                 "\u{1F988}","\u{1F987}","\u{1F418}","\u{1F433}","\u{1F980}","\u{1F991}","\u{1F40A}","\u{1F40D}",
                 "\u{1F982}","\u{1F985}","\u{1F42A}","\u{1F98F}","\u{1F438}","\u{1F994}","\u{1F995}","\u{1F407}",
                 "\u{1F98E}","\u{1F41F}","\u{1F41C}","\u{1F986}"];

const COLORS = ["#B3591F","#43489B","#1E5C46","#A02F2C","#6B4C9A","#0F6E77",
                "#8A6D1F","#2F5FA8","#7A3B6B","#3E6B2A","#A34A2E","#245C86",
                "#6E3A8C","#186B58","#8E4A1E","#4A4E8F"];

/* ============================================================
   State - the log is the source of truth, totals are derived
   ============================================================ */

let players = [];
let log = [];                    // { id, ts, type:"delta", playerId, value }
let arrangeMode = false;
let prefs = { ambient: true, wakeLock: true, winCondition: "high" };
let openId = null;               // player whose panel is expanded
let entry = "";                  // pending delta, as a string, for whichever mode is open
let safe = { top: 0, right: 0, bottom: 0, left: 0 };
let totals = {};
let roundScores = {};

const stage  = document.getElementById("stage");
const centre = document.getElementById("centre");
const probe  = document.getElementById("probe");
const vpEl   = document.getElementById("vp");
const scrim  = document.getElementById("scrim");
const sheet  = document.getElementById("sheet");

const uid = () => Math.random().toString(36).slice(2, 9);
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const esc = s => String(s).replace(/[&<>"']/g, c =>
  ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));

/* Totals are never stored. If they ever disagreed with the log the log
   would win, so there is nothing to disagree with. */
/* The log holds two kinds of entry: a `delta` for a score change and a
   `round` marker for End Round. A player's round score is simply the
   deltas after the last marker, so nothing about rounds is stored twice
   and undoing a marker un-ends the round for free. */
function lastMarker() {
  for (let i = log.length - 1; i >= 0; i--) if (log[i].type === "round") return i;
  return -1;
}
function roundNo() { return log.filter(e => e.type === "round").length + 1; }

function recompute() {
  totals = {}; roundScores = {};
  for (const p of players) { totals[p.id] = 0; roundScores[p.id] = 0; }
  const from = lastMarker() + 1;
  log.forEach((e, i) => {
    if (e.type !== "delta" || totals[e.playerId] === undefined) return;
    totals[e.playerId] += e.value;
    if (i >= from) roundScores[e.playerId] += e.value;
  });
}

/* Completed rounds, rebuilt from the markers. */
function roundTable() {
  const out = []; let acc = {}; let n = 1;
  for (const e of log) {
    if (e.type === "delta") acc[e.playerId] = (acc[e.playerId] || 0) + e.value;
    else if (e.type === "round") { out.push({ n: n++, scores: acc }); acc = {}; }
  }
  return out;
}

/* Highest or lowest, depending on the setting. Returns null when every
   player is level — marking all sixteen tells nobody anything. */
function bestOf(map) {
  if (players.length < 2) return null;
  const vals = players.map(pl => map[pl.id] || 0);
  const hi = Math.max.apply(null, vals), lo = Math.min.apply(null, vals);
  if (hi === lo) return null;
  return prefs.winCondition === "low" ? lo : hi;
}

function save() {
  try {
    localStorage.setItem(STORE, JSON.stringify({
      version: 1,
      players: players.map(p => ({ id: p.id, name: p.name, color: p.color, emoji: p.emoji,
                                   edge: p.edge, fraction: p.fraction, mode: p.mode,
                                   textSize: p.textSize })),
      log: log,
      prefs: prefs
    }));
    lastSave = new Date().toTimeString().slice(0, 8);
  } catch (e) {
    lastSave = "FAILED";     // private mode or quota - the game keeps working
    storageOk = false;
  }
}

function load() {
  try {
    const raw = localStorage.getItem(STORE);
    if (!raw) return false;
    const d = JSON.parse(raw);
    if (!d || d.version !== 1 || !Array.isArray(d.players) || !d.players.length) return false;
    players = d.players;
    log = Array.isArray(d.log) ? d.log : [];
    if (d.prefs) {
      if (typeof d.prefs.ambient === "boolean") prefs.ambient = d.prefs.ambient;
      if (typeof d.prefs.wakeLock === "boolean") prefs.wakeLock = d.prefs.wakeLock;
      if (d.prefs.winCondition === "low" || d.prefs.winCondition === "high") prefs.winCondition = d.prefs.winCondition;
    }
    return true;
  } catch (e) { return false; }
}

/* Screen Wake Lock. A device sits on a table for an hour; nothing kills
   the experience faster than the screen sleeping every thirty seconds.
   It drops silently on tab switch, so it is re-acquired on visibility. */
let wakeLock = null;
let wakeLockState = "off";

async function acquireWakeLock() {
  if (!prefs.wakeLock) { wakeLockState = "off"; return; }
  if (!("wakeLock" in navigator)) { wakeLockState = "unsupported"; return; }
  if (wakeLock) return;
  try {
    wakeLock = await navigator.wakeLock.request("screen");
    wakeLockState = "held";
    wakeLock.addEventListener("release", () => { wakeLock = null; wakeLockState = "released"; });
  } catch (e) { wakeLock = null; wakeLockState = "denied"; }
  paintHub();
}
function dropWakeLock() {
  if (wakeLock) { wakeLock.release().catch(() => {}); wakeLock = null; }
  wakeLockState = prefs.wakeLock ? "released" : "off";
}
document.addEventListener("visibilitychange", () => {
  if (document.visibilityState === "visible") acquireWakeLock(); else dropWakeLock();
});

let ambientTimer = null;

function scheduleAmbient() {
  clearTimeout(ambientTimer);
  if (!prefs.ambient) { document.body.classList.remove("ambient"); return; }
  ambientTimer = setTimeout(function () {
    /* Something open is not idle. */
    if (openId || sheet.classList.contains("on")) { scheduleAmbient();
acquireWakeLock(); return; }
    document.body.classList.add("ambient");
  }, AMBIENT_MS);
}

function wake() {
  document.body.classList.remove("ambient");
  scheduleAmbient();
acquireWakeLock();
  if (prefs.wakeLock && !wakeLock) acquireWakeLock();   // Safari wants a gesture
}

/* Capture, so a tap wakes the tabs even when it lands on a control that
   stops propagation. The tap still does its job — waking is not a mode
   you have to tap past first. */
window.addEventListener("pointerdown", wake, true);

/* Every mutation ends here, so autosave can never be forgotten. */
function commit() {
  recompute();
  save();
  layout(true);
  paintHub();
  wake();
}

/* ============================================================
   Players
   ============================================================ */

/* Prefers an unused animal, but duplicates are allowed if that is what
   is left, or what someone picks on purpose. */
function freeEmoji() {
  const used = new Set(players.map(p => p.emoji));
  const pool = ANIMALS.filter(a => !used.has(a));
  const from = pool.length ? pool : ANIMALS;
  return from[Math.floor(Math.random() * from.length)];
}
function freeColor() {
  const used = new Set(players.map(p => p.color));
  const pool = COLORS.filter(c => !used.has(c));
  return (pool.length ? pool : COLORS)[0];
}

function addPlayer(name) {
  if (players.length >= MAX_PLAYERS) return null;
  const p = { id: uid(), name: name || "Player " + (players.length + 1),
              color: freeColor(), emoji: freeEmoji(), edge: "bottom", fraction: 0.5,
              mode: "pad", textSize: "normal" };
  players.push(p);
  placeNew(p);
  return p;
}

/* A late joiner lands on the emptiest edge, after whoever is already
   there. It must NOT auto-arrange: everyone else has been placed by hand
   to match where they are sitting, and adding a player is no reason to
   throw that away. */
function placeNew(p) {
  const rect = safeRect();
  const others = players.filter(x => x !== p);
  const best = EDGES
    .map(e => ({ e: e, room: edgeCapacity(e, rect) - others.filter(x => x.edge === e).length }))
    .sort((a, b) => b.room - a.room)[0];
  p.edge = best && best.room > 0 ? best.e : "bottom";
  const mates = others.filter(x => x.edge === p.edge);
  p.fraction = mates.length
    ? Math.min(1, Math.max.apply(null, mates.map(x => x.fraction)) + 0.15)
    : 0.5;
}

function removePlayer(id) {
  players = players.filter(p => p.id !== id);
  log = log.filter(e => e.playerId !== id);
  if (openId === id) closePanel();
}

/* Allocate players to edges in proportion to usable span - the long edges
   carry roughly 2.5x the short ones, so round-robin would crowd them. */
function autoArrange() {
  const rect = safeRect();
  const spans = EDGES.map(e => ({ e: e, span: edgeSpan(e, rect).length }));
  const total = spans.reduce((s, x) => s + x.span, 0) || 1;
  const n = players.length;
  const counts = spans.map(x => ({ e: x.e, n: Math.floor(n * x.span / total), rem: (n * x.span / total) % 1 }));
  const left = n - counts.reduce((s, c) => s + c.n, 0);
  counts.slice().sort((a, b) => b.rem - a.rem).forEach((c, i) => { if (i < left) c.n++; });
  let i = 0;
  for (const c of counts) {
    for (let k = 0; k < c.n && i < n; k++, i++) {
      players[i].edge = c.e;
      players[i].fraction = (k + 0.5) / c.n;
    }
  }
}

/* ============================================================
   Geometry - carried over from M1 intact
   ============================================================ */

function readSafeInsets() {
  const cs = getComputedStyle(probe);
  safe = { top: parseFloat(cs.paddingTop) || 0, right: parseFloat(cs.paddingRight) || 0,
           bottom: parseFloat(cs.paddingBottom) || 0, left: parseFloat(cs.paddingLeft) || 0 };
}
function viewport() {
  const r = vpEl.getBoundingClientRect();
  return { w: r.width || window.innerWidth, h: r.height || window.innerHeight };
}
function isStandalone() {
  return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
}
function bleedFor(edge) {
  const reported = safe[edge] || 0;
  if (reported === 0 && edge === "bottom" && isStandalone()) {
    return Math.min(screen.width, screen.height) >= 600 ? HOME_BAR_TABLET : HOME_BAR_PHONE;
  }
  return reported;
}
function edgeDepth(edge) { return DEPTH + bleedFor(edge); }

function safeRect() {
  const v = viewport();
  return { l: bleedFor("left"), t: bleedFor("top"), r: v.w - bleedFor("right"), b: v.h - bleedFor("bottom") };
}
function edgeLength(edge, rect) {
  return (edge === "top" || edge === "bottom") ? rect.r - rect.l : rect.b - rect.t;
}
/* The whole edge, corners included. Tabs may not use this — they would
   collide with the adjoining edge — but a modal panel may. */
function edgeRange(edge, rect) {
  return { start: (edge === "top" || edge === "bottom") ? rect.l : rect.t,
           length: edgeLength(edge, rect) };
}

function edgeSpan(edge, rect) {
  const len = edgeLength(edge, rect);
  const start = (edge === "top" || edge === "bottom") ? rect.l : rect.t;
  return { start: start + DEPTH, length: Math.max(0, len - DEPTH * 2) };
}
function edgeCapacity(edge, rect) {
  return Math.max(0, Math.floor((edgeSpan(edge, rect).length + GAP) / (MIN_LEN + GAP)));
}

/* One `length x depth` box placed by a single translate+rotate. In local
   coordinates y=0 is ALWAYS the inward edge and y=depth the outer one. */
function tabTransform(edge, along, len, depth) {
  const v = viewport(), W = v.w, H = v.h, D = depth;
  switch (edge) {
    case "bottom": return "translate(" + along + "px, " + (H - D) + "px) rotate(0deg)";
    case "top":    return "translate(" + (along + len) + "px, " + D + "px) rotate(180deg)";
    case "left":   return "translate(" + D + "px, " + along + "px) rotate(90deg)";
    case "right":  return "translate(" + (W - D) + "px, " + (along + len) + "px) rotate(-90deg)";
  }
}

/* ============================================================
   Layout
   ============================================================ */

function layout(commitPos) {
  const rect = safeRect();
  spillOverfullEdges(rect);

  for (const edge of EDGES) {
    const span = edgeSpan(edge, rect);
    const group = players.filter(p => p.edge === edge).sort((a, b) => a.fraction - b.fraction);
    const n = group.length;
    if (!n) continue;

    const ideal = (span.length * FILL - GAP * (n - 1)) / n;
    const len = Math.max(MIN_LEN, Math.min(MAX_LEN, ideal));
    const half = len / 2;
    const lo = span.start + half, hi = span.start + span.length - half;
    const pitch = len + GAP;
    const centres = group.map(p => clamp(span.start + p.fraction * span.length, lo, hi));

    /* The dragged tab is pinned; neighbours relax outward from it. */
    const pin = group.findIndex(p => p.lifted);
    if (pin >= 0) {
      for (let i = pin + 1; i < n; i++) centres[i] = Math.max(centres[i], centres[i - 1] + pitch);
      for (let i = pin - 1; i >= 0; i--) centres[i] = Math.min(centres[i], centres[i + 1] - pitch);
    } else {
      for (let i = 1; i < n; i++) centres[i] = Math.max(centres[i], centres[i - 1] + pitch);
      for (let i = n - 2; i >= 0; i--) centres[i] = Math.min(centres[i], centres[i + 1] - pitch);
    }
    /* Only the ends may override the pin, and only once the edge is full. */
    if (centres[0] < lo) {
      centres[0] = lo;
      for (let i = 1; i < n; i++) centres[i] = Math.max(centres[i], centres[i - 1] + pitch);
    }
    if (centres[n - 1] > hi) {
      centres[n - 1] = hi;
      for (let i = n - 2; i >= 0; i--) centres[i] = Math.min(centres[i], centres[i + 1] - pitch);
    }

    group.forEach((p, i) => {
      const c = clamp(centres[i], lo, hi);
      p._len = len;
      p._along = c - half;
      /* Displacement becomes real only on drop; committing every frame
         would let a tab be shoved for ever and never spring back. */
      if (commitPos && span.length > 0) p.fraction = clamp((c - span.start) / span.length, 0, 1);
    });
  }
  render(rect);
}

function spillOverfullEdges(rect) {
  for (const edge of EDGES) {
    const cap = edgeCapacity(edge, rect);
    const group = players.filter(p => p.edge === edge).sort((a, b) => a.fraction - b.fraction);
    while (group.length > cap) {
      const target = EDGES.map(e => ({ e: e, room: edgeCapacity(e, rect) - players.filter(p => p.edge === e).length }))
                          .sort((a, b) => b.room - a.room)[0];
      if (!target || target.room <= 0) break;
      const moved = group.pop();
      moved.edge = target.e;
      moved.fraction = 0.5;
    }
  }
}

/* Panel size: big enough for the pad, clamped to its edge and to the
   screen so it can never run off either. */
/* An open panel is modal — the scrim covers everything else — so it is
   not bound by the corner reservation that keeps tabs apart, and it may
   reach a little past the opposite edge's tabs. */
/* 370 x 340 is the size a panel comes out at on the short edge of an
   iPhone, and it is the target everywhere: a bigger screen gets the same
   panel, not a bigger one. Less is fine when the space is not there. */
const PANEL_INSET     = 16;  // breathing room at each end of the edge
const PANEL_MAX_LEN   = 370;
const PANEL_MAX_DEPTH = 340;
const PANEL_RESERVE   = 64;  // left clear on the far side

function panelSize(edge, rect) {
  const v = viewport();
  const full = edgeRange(edge, rect).length;
  const len = Math.max(MIN_LEN, Math.min(full - PANEL_INSET * 2, PANEL_MAX_LEN));
  const across = (edge === "top" || edge === "bottom") ? v.h : v.w;
  const depth = Math.max(DEPTH, Math.min(PANEL_MAX_DEPTH, across - PANEL_RESERVE)) + bleedFor(edge);
  return { len: len, depth: depth };
}

/* Thresholds allow for the round number being back on the second row.
   Below t-emoji only the emoji and total survive. */
function tierFor(len) {
  if (len >= 150) return "";           // emoji + full name / round + total
  if (len >= 108) return "t-first";    // emoji + first name / round + total
  if (len >= 76)  return "t-first";
  return "t-emoji";                    // emoji / total
}

function render(rect) {
  const leadAt = bestOf(totals);
  const table = roundTable();
  const lastRound = table.length ? table[table.length - 1].scores : null;
  const hotAt = lastRound ? bestOf(lastRound) : null;
  /* Round scores only mean something once a round has been closed —
     before that they are identical to the total. */
  const showRound = table.length > 0;

  for (const p of players) {
    const el = p.el;
    const open = p.id === openId;
    const bleed = bleedFor(p.edge);
    const size = open ? panelSize(p.edge, rect) : { len: p._len, depth: edgeDepth(p.edge) };

    let along = p._along;
    if (open) {
      const range = edgeRange(p.edge, rect);      // corners included
      const mid = p._along + p._len / 2;
      along = clamp(mid - size.len / 2, range.start,
                    range.start + Math.max(0, range.length - size.len));
    }

    el.style.width = size.len + "px";
    el.style.height = size.depth + "px";
    /* The tab's own padding reserves the star strip for the COMPACT
       layout. An open panel does its own padding, so leaving the tab's
       in place boxes the panel inside 24px it cannot use — visible in
       landscape as dead space above the home indicator. */
    el.style.padding = open ? "0px" : ("7px 0 " + (PAD_OUT + bleed) + "px");
    el.style.setProperty("--bleed", bleed + "px");
    el.style.transform = tabTransform(p.edge, along, size.len, size.depth);

    /* Transform only animates when the tab stays on the same edge: CSS
       interpolates the whole matrix, so easing across a rotation change
       tumbles the tab through intermediate angles. */
    const sameEdge = p._renderedEdge === p.edge;
    el.className = "tab " + tierFor(size.len) +
                   (p.textSize === "large" ? " size-large" : "") +
                   (p.lifted ? " lifted" : (sameEdge ? " settling" : "")) +
                   (open ? " open" : "") +
                   (leadAt !== null && (totals[p.id] || 0) === leadAt ? " leading" : "") +
                   (hotAt !== null && (lastRound[p.id] || 0) === hotAt ? " won-round" : "");
    p._renderedEdge = p.edge;

    el.querySelector(".who").textContent = size.len >= 150 ? p.name : p.name.split(" ")[0];
    el.querySelector(".tot").textContent = totals[p.id] || 0;
    const rnd = el.querySelector(".rnd");
    rnd.textContent = showRound ? (roundScores[p.id] || 0) : "";
    rnd.style.display = showRound ? "" : "none";
    if (open) paintPanel(p);
  }

  const occupied = e => players.some(p => p.edge === e);
  centre.style.left   = (rect.l + (occupied("left") ? DEPTH : 0) + 10) + "px";
  centre.style.top    = (rect.t + (occupied("top")  ? DEPTH : 0) + 10) + "px";
  centre.style.width  = (rect.r - rect.l - (occupied("left") ? DEPTH : 0) - (occupied("right")  ? DEPTH : 0) - 20) + "px";
  centre.style.height = (rect.b - rect.t - (occupied("top")  ? DEPTH : 0) - (occupied("bottom") ? DEPTH : 0) - 20) + "px";
}

function buildTab(p) {
  const el = document.createElement("div");
  el.className = "tab";
  el.style.background = p.color;
  el.innerHTML =
    '<div class="compact">' +
      '<span class="name"><span class="emoji"></span><span class="who"></span></span>' +
      '<span class="nums"><span class="rnd"></span><span class="tot"></span></span>' +
      '<span class="star">★</span>' +
      '<span class="bar"></span>' +
    '</div>' +
    '<div class="panel"></div>';
  el.querySelector(".emoji").textContent = p.emoji;
  el.addEventListener("pointerdown", e => onPointerDown(e, p));
  stage.appendChild(el);
  return el;
}

function rebuildTabs() {
  /* Remove only the tabs: innerHTML = "" would take the scrim with them. */
  Array.prototype.forEach.call(stage.querySelectorAll(".tab"), el => el.remove());
  for (const p of players) p.el = buildTab(p);
}

/* ============================================================
   The panel - the tab, grown
   ============================================================ */

function openPanel(p) {
  openId = p.id;
  entry = "";                       // nothing pending until something is tapped
  if (p.mode !== "keys" && p.mode !== "pad") p.mode = "pad";
  scrim.classList.add("on");
  layout(false);
}

/* Closing without confirming discards the pending delta. Nothing has
   reached the log yet, so there is nothing to roll back. */
function closePanel() {
  openId = null;
  entry = "";
  scrim.classList.remove("on");
  layout(false);
}

/* One log entry per confirmed edit, however many taps built it. */
function confirmPanel(p) {
  const pend = pendingOf();
  entry = "";
  if (pend) score(p, pend); else layout(false);
  closePanel();
}

/* One header in both modes: emoji, name, pending, total, confirm. The
   total never moves, so switching modes does not shift what you are
   reading. `entry` is the pending delta as a string and is the ONLY
   thing the pad and the keypad both write to — pad buttons add to it,
   digits append to it, so switching modes needs no conversion. */
function pendingOf() { return parseInt(entry, 10) || 0; }

function paintPanel(p) {
  const box = p.el.querySelector(".panel");
  const keys = p.mode === "keys";
  const pend = pendingOf();
  const shown = (totals[p.id] || 0) + pend;
  const mine = log.filter(e => e.type === "delta" && e.playerId === p.id);

  const header =
    '<div class="ptop">' +
      '<span style="font-size:22px">' + p.emoji + '</span>' +
      '<span class="pname">' + esc(p.name) + '</span>' +
      (entry === ""
        ? ""
        : '<span class="pend">' +
            (entry === "-" ? "\u2212" : (pend > 0 ? "+" + pend : String(pend))) +
          '</span>') +
      '<span class="ptot">' + shown + '</span>' +
    '</div>';

  const foot =
    '<div class="prow">' +
      '<button class="btn2" data-act="mode">' + (keys ? "\u00b1 Pad" : "Custom") + '</button>' +
      '<button class="btn2" data-act="clear"' + (entry === "" ? " disabled" : "") + '>Clear</button>' +
      '<button class="btn2" data-act="undo"' + (mine.length ? "" : " disabled") + '>Undo</button>' +
      '<button class="btn2 ok" data-act="ok" aria-label="Save and close">\u2713</button>' +
    '</div>';

  const body = keys
    ? '<div class="keys">' +
        [1,2,3,4,5,6,7,8,9].map(n => '<button data-k="' + n + '">' + n + '</button>').join("") +
        '<button data-k="sign">\u00b1</button>' +
        '<button data-k="0">0</button>' +
        '<button data-k="del">\u232b</button>' +
      '</div>'
    : '<div class="pad">' +
        '<button class="minus" data-d="-10">\u221210</button>' +
        '<button class="minus" data-d="-5">\u22125</button>' +
        '<button class="minus" data-d="-1">\u22121</button>' +
        '<button data-d="1">+1</button>' +
        '<button data-d="5">+5</button>' +
        '<button data-d="10">+10</button>' +
      '</div>';

  box.innerHTML = header + body + foot;
}

function score(p, delta) {
  if (!delta) return;
  log.push({ id: uid(), ts: Date.now(), type: "delta", playerId: p.id, value: delta });
  commit();
}

/* End Round drops a marker. Round scores become the deltas after it,
   which is to say zero, and the counter moves on. */
function endRound() {
  if (!log.some(e => e.type === "delta")) return;      // nothing to end
  log.push({ id: uid(), ts: Date.now(), type: "round", n: roundNo() });
  commit();
}

function undoLast(playerId) {
  /* Global undo takes back whatever happened last, End Round included.
     Per-player undo only ever touches that player's own scores. */
  if (!playerId && log.length && log[log.length - 1].type === "round") {
    log.pop(); commit(); return true;
  }
  for (let i = log.length - 1; i >= 0; i--) {
    if (log[i].type === "delta" && (!playerId || log[i].playerId === playerId)) {
      log.splice(i, 1);
      commit();
      return true;
    }
  }
  return false;
}

stage.addEventListener("click", e => {
  if (!openId) return;
  const p = players.find(x => x.id === openId);
  if (!p || !p.el.contains(e.target)) return;

  const act = e.target.closest("[data-act]");
  const d   = e.target.closest("[data-d]");
  const k   = e.target.closest("[data-k]");

  /* Pad and keypad write to the same buffer: one adds, the other appends. */
  if (d) {
    entry = String(pendingOf() + parseInt(d.dataset.d, 10));
    if (entry === "0") entry = "";
    layout(false);
    return;
  }
  if (k) {
    const key = k.dataset.k;
    if (key === "del")       entry = entry.replace(/.$/, "");
    else if (key === "sign") entry = entry.charAt(0) === "-" ? entry.slice(1) : "-" + entry;
    else if (entry.replace("-", "").length < 4) entry += key;
    layout(false);
    return;
  }
  if (act) {
    const a = act.dataset.act;
    if (a === "ok")    confirmPanel(p);
    if (a === "clear") { entry = ""; layout(false); }
    if (a === "undo")  { entry = ""; undoLast(p.id); }
    if (a === "mode")  { p.mode = p.mode === "keys" ? "pad" : "keys"; save(); layout(false); }
  }
});

scrim.addEventListener("click", () => { closePanel(); closeSheet(); });

/* ============================================================
   Drag
   ============================================================ */

let drag = null;

function onPointerDown(e, p) {
  if (openId) return;                       // panel open: no dragging
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  p.el.setPointerCapture(e.pointerId);
  drag = { p: p, id: e.pointerId, x0: e.clientX, y0: e.clientY, active: false, moved: false, timer: null };

  if (arrangeMode) lift(p);
  else drag.timer = setTimeout(() => { if (drag) lift(p); }, HOLD_MS);

  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);
}

function lift(p) {
  if (!drag) return;
  drag.active = true;
  p.lifted = true;
  p.el.classList.add("lifted");
  p.el.classList.remove("settling");
  if (navigator.vibrate) navigator.vibrate(8);
}

function onPointerMove(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx, dy) > SLOP) {
    drag.moved = true;
    if (!drag.active && drag.timer) { clearTimeout(drag.timer); drag.timer = null; }
  }
  if (!drag.active) return;
  const hit = projectToEdge(e.clientX, e.clientY, safeRect());
  drag.p.edge = hit.edge;
  drag.p.fraction = hit.fraction;
  layout(false);
}

function onPointerUp(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  if (drag.timer) clearTimeout(drag.timer);
  const p = drag.p, wasDrag = drag.active, moved = drag.moved;
  drag = null;
  if (wasDrag) {
    layout(true);                 // commit while still pinned
    p.lifted = false;
    p.el.classList.remove("lifted");
    layout(true);
    save();
  } else if (!moved) {
    openPanel(p);
  }
  window.removeEventListener("pointermove", onPointerMove);
  window.removeEventListener("pointerup", onPointerUp);
  window.removeEventListener("pointercancel", onPointerUp);
}

function projectToEdge(x, y, rect) {
  const d = { top: y - rect.t, bottom: rect.b - y, left: x - rect.l, right: rect.r - x };
  const edge = EDGES.reduce((best, e) => (d[e] < d[best] ? e : best), "top");
  const span = edgeSpan(edge, rect);
  const along = (edge === "top" || edge === "bottom") ? x : y;
  const f = span.length > 0 ? (along - span.start) / span.length : 0.5;
  return { edge: edge, fraction: clamp(f, 0, 1) };
}

/* ============================================================
   Hub
   ============================================================ */

function paintHub() {
  const lead = document.getElementById("lead");
  const scored = log.some(e => e.type === "delta");
  const n = roundNo();
  const at = bestOf(totals);
  const verb = prefs.winCondition === "low" ? "lowest on" : "leads on";
  let line;
  if (!players.length)      line = "No players yet.<br>Add a few to start.";
  else if (!scored)         line = players.length + " players &middot; no score yet";
  else if (at === null)     line = "All level";
  else {
    const tied = players.filter(p => (totals[p.id] || 0) === at);
    line = tied.length > 1
      ? tied.length + " tied on <b>" + at + "</b>"
      : "<b>" + esc(tied[0].name.split(" ")[0]) + "</b> " + verb + " <b>" + at + "</b>";
  }
  lead.innerHTML = "Round <b>" + n + "</b><br>" + line;

  document.getElementById("undo").disabled = !log.length;
  document.getElementById("endRound").disabled = !scored ||
    log.length === 0 || log[log.length - 1].type === "round";
  document.getElementById("diagToggle").textContent =
    BUILD + (storageOk ? "" : "  \u00b7 no storage");
  paintDiag();
}

function paintDiag() {
  const box = document.getElementById("diagbox");
  if (!box.classList.contains("on")) return;
  const v = viewport();
  const ins = EDGES.map(e => (safe[e] | 0)).join("/");
  const eff = EDGES.map(e => (bleedFor(e) | 0)).join("/");
  const deltas = log.filter(e => e.type === "delta").length;
  box.innerHTML =
    "build   <b>" + BUILD + "</b>\n" +
    "mode    " + (isStandalone() ? "standalone" : "browser") + "\n" +
    "inset   " + ins + " -> " + eff + "\n" +
    "vp      " + Math.round(v.w) + "x" + Math.round(v.h) +
      "   inner " + window.innerWidth + "x" + window.innerHeight + "\n" +
    "screen  " + screen.width + "x" + screen.height + "\n" +
    "storage " + (storageOk ? "ok" : "<span class='warn'>UNAVAILABLE</span>") +
      "   saved " + lastSave + "\n" +
    "state   " + players.length + " players, " + deltas + " scores";
}

document.getElementById("diagToggle").addEventListener("click", () => {
  const box = document.getElementById("diagbox");
  box.classList.toggle("on");
  paintDiag();
});

document.getElementById("undo").addEventListener("click", () => undoLast(null));
document.getElementById("endRound").addEventListener("click", endRound);
document.getElementById("rounds").addEventListener("click", () => openSheet("rounds"));
document.getElementById("arrange").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  arrangeMode = b.dataset.arrange === "on";
  Array.prototype.forEach.call(e.currentTarget.children,
    c => c.setAttribute("aria-pressed", String(c === b)));
});

/* ============================================================
   Players sheet - centre, unrotated, native inputs are fine here
   ============================================================ */

let sheetView = "players";
function openSheet(view) {
  sheetView = view || "players";
  sheet.classList.add("on"); scrim.classList.add("on"); paintSheet();
}
function closeSheet() { sheet.classList.remove("on"); scrim.classList.remove("on"); }

function paintRounds() {
  const table = roundTable();
  const head = "<tr><th>#</th>" + players.map(pl =>
    '<th title="' + esc(pl.name) + '">' + pl.emoji + "</th>").join("") + "</tr>";
  const body = table.map(r => '<tr><td class="rn">' + r.n + "</td>" +
      players.map(pl => "<td>" + (r.scores[pl.id] || 0) + "</td>").join("") + "</tr>").join("");
  const live = '<tr class="live"><td class="rn">' + roundNo() + "</td>" +
      players.map(pl => "<td>" + (roundScores[pl.id] || 0) + "</td>").join("") + "</tr>";
  const sum = '<tr class="tot"><td class="rn">&Sigma;</td>' +
      players.map(pl => "<td>" + (totals[pl.id] || 0) + "</td>").join("") + "</tr>";

  sheet.innerHTML =
    "<h2>Rounds</h2>" +
    (players.length
      ? '<div class="gridwrap"><table class="rounds">' + head + body + live + sum + "</table></div>"
      : '<div class="lead">No players yet.</div>') +
    '<div class="btns">' +
      '<button class="btn" data-act="players">Players</button>' +
      '<button class="btn" data-act="done">Done</button>' +
    "</div>";
}

function paintSheet() {
  if (sheetView === "rounds") return paintRounds();
  const rows = players.map(p =>
    '<div class="prow2" data-id="' + p.id + '">' +
      '<input class="emo" data-act="emoji" value="' + esc(p.emoji) + '" ' +
        'style="background:' + p.color + '" aria-label="Emoji" ' +
        'autocomplete="off" autocorrect="off" autocapitalize="off" enterkeyhint="done">' +
      '<input class="col" data-act="color" type="color" value="' + p.color + '" aria-label="Colour">' +
      '<button class="tsize" data-act="tsize" aria-label="Text size" title="Text size">' +
        (p.textSize === "large" ? "A" : "a") + "</button>" +
      '<input value="' + esc(p.name) + '" data-act="name" maxlength="24" ' +
        'aria-label="Name" enterkeyhint="done">' +
      '<button class="kill" data-act="remove" aria-label="Remove">✕</button>' +
    '</div>'
  ).join("");

  sheet.innerHTML =
    "<h2>Players</h2>" +
    '<div class="plist">' + rows + "</div>" +
    '<div class="btns">' +
      '<button class="btn primary" data-act="add"' + (players.length >= MAX_PLAYERS ? " disabled" : "") + ">Add player</button>" +
      '<button class="btn" data-act="done">Done</button>' +
    "</div>" +
    '<div class="setting">' +
      "<span>Winner</span>" +
      '<div class="seg">' +
        '<button data-act="win" data-v="high"' + (prefs.winCondition === "high" ? ' aria-pressed="true"' : "") + ">Highest</button>" +
        '<button data-act="win" data-v="low"'  + (prefs.winCondition === "low"  ? ' aria-pressed="true"' : "") + ">Lowest</button>" +
      "</div>" +
    "</div>" +
    '<div class="setting">' +
      "<span>Keep screen awake</span>" +
      '<div class="seg">' +
        '<button data-act="lock" data-v="on"'  + (prefs.wakeLock ? ' aria-pressed="true"' : "") + ">On</button>" +
        '<button data-act="lock" data-v="off"' + (prefs.wakeLock ? "" : ' aria-pressed="true"') + ">Off</button>" +
      "</div>" +
    "</div>" +
    '<div class="setting">' +
      "<span>Dim when idle</span>" +
      '<div class="seg">' +
        '<button data-act="ambient" data-v="on"'  + (prefs.ambient ? ' aria-pressed="true"' : "") + ">On</button>" +
        '<button data-act="ambient" data-v="off"' + (prefs.ambient ? "" : ' aria-pressed="true"') + ">Off</button>" +
      "</div>" +
    "</div>" +
    '<div class="btns">' +
      '<button class="btn" data-act="reset"' + (log.length ? "" : " disabled") + ">Reset scores</button>" +
      '<button class="btn" data-act="wipe">Start over</button>' +
    "</div>" +
    (players.length >= MAX_PLAYERS ? '<div class="lead">Sixteen is the cap.</div>' : "");
}

sheet.addEventListener("click", e => {
  const b = e.target.closest("[data-act]");
  if (!b || b.tagName === "INPUT") return;
  const act = b.dataset.act;
  const row = b.closest("[data-id]");
  const rowId = row ? row.dataset.id : null;

  if (act === "add")    { addPlayer(); rebuildTabs(); commit(); paintSheet(); return; }
  if (act === "done")   { closeSheet(); return; }
  if (act === "tsize") {
    const pl = players.find(x => x.id === rowId);
    if (pl) { pl.textSize = pl.textSize === "large" ? "normal" : "large"; commit(); paintSheet(); }
    return;
  }
  if (act === "ambient") { prefs.ambient = b.dataset.v === "on"; save(); wake(); paintSheet(); return; }
  if (act === "win")  { prefs.winCondition = b.dataset.v; save(); commit(); paintSheet(); return; }
  if (act === "lock") {
    prefs.wakeLock = b.dataset.v === "on";
    save();
    if (prefs.wakeLock) acquireWakeLock(); else dropWakeLock();
    paintSheet();
    return;
  }
  if (act === "players") { sheetView = "players"; paintSheet(); return; }
  if (act === "reset")  { log = []; commit(); paintSheet(); return; }
  if (act === "wipe") {
    players = []; log = [];
    try { localStorage.removeItem(STORE); } catch (err) {}
    ["Ann", "Rai", "Bo", "Kit"].forEach(n => addPlayer(n));
    autoArrange();
    rebuildTabs(); commit(); paintSheet();
    return;
  }
  if (act === "remove") { removePlayer(rowId); rebuildTabs(); commit(); paintSheet(); return; }
});

/* Emoji can be several code points — a ZWJ sequence, a flag — so take
   the first grapheme rather than the first character. */
function firstGrapheme(str) {
  const s = String(str || "").trim();
  if (!s) return "";
  if (typeof Intl !== "undefined" && Intl.Segmenter) {
    for (const g of new Intl.Segmenter(undefined, { granularity: "grapheme" }).segment(s)) {
      return g.segment;
    }
  }
  return Array.from(s)[0] || "";
}

/* No paintSheet from here: rebuilding the list would steal the caret. */
sheet.addEventListener("input", e => {
  const inp = e.target.closest("input[data-act]");
  const row = inp && inp.closest("[data-id]");
  if (!row) return;
  const p = players.find(x => x.id === row.dataset.id);
  if (!p) return;

  if (inp.dataset.act === "name") {
    p.name = inp.value;
  } else if (inp.dataset.act === "color") {
    p.color = inp.value;
    p.el.style.background = p.color;
    const emo = row.querySelector('input[data-act="emoji"]');
    if (emo) emo.style.background = p.color;
  } else if (inp.dataset.act === "emoji") {
    const g = firstGrapheme(inp.value);
    if (!g) return;                       // mid-edit; wait for a character
    p.emoji = g;
    p.el.querySelector(".emoji").textContent = g;
  }
  commit();
});

/* Normalise the emoji field on blur, not on input — rewriting value while
   someone is typing fights the emoji keyboard. */
sheet.addEventListener("focusout", e => {
  const inp = e.target.closest('input[data-act="emoji"]');
  const row = inp && inp.closest("[data-id]");
  if (!row) return;
  const p = players.find(x => x.id === row.dataset.id);
  if (p && inp.value !== p.emoji) inp.value = p.emoji;
});

document.getElementById("manage").addEventListener("click", openSheet);

/* ============================================================
   Boot
   ============================================================ */

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { readSafeInsets(); layout(true); }, 80);
});
window.addEventListener("orientationchange", () =>
  setTimeout(() => { readSafeInsets(); layout(true); }, 250));

probeStorage();
readSafeInsets();
if (!load()) {
  ["Ann", "Rai", "Bo", "Kit"].forEach(n => addPlayer(n));
  autoArrange();          // fresh game: spread evenly
}
rebuildTabs();
commit();
scheduleAmbient();
acquireWakeLock();
</script>
