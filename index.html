<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark light">
<!-- apple-mobile-web-app-capable + viewport-fit=cover is what makes iOS
     report real safe-area insets in standalone; without it env() reads 0.
     The status bar is deliberately NOT black-translucent: translucent moves
     the viewport origin up under the status bar without growing its height,
     leaving an unpaintable black band along the bottom. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Keeping Tabs</title>
<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="probe"></div>
<div id="vp"></div>
<div id="stage">
  <div id="scrim"></div>
</div>

<div id="center">
  <div class="hub">
    <h1>Keeping Tabs</h1>
    <div class="lead" id="lead"></div>
    <button class="btn" id="roundentry">Enter round</button>
    <button class="btn primary" id="endRound">End round</button>
    <div class="btns">
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="rounds">Rounds</button>
    </div>
    <div class="btns">
      <button class="btn" id="manage">Players</button>
      <button class="btn" id="game">Game</button>
    </div>
    <div class="seg" id="arrange">
      <button data-arrange="off" aria-pressed="true">Locked</button>
      <button data-arrange="on" aria-pressed="false">Arrange</button>
    </div>
    <button class="tiny" id="diagToggle"></button>
    <div class="diagbox" id="diagbox"></div>
  </div>
</div>

<div id="sheet"></div>
<div id="emopop"></div>
<script src="app.js"></script>
</body>
</html>
