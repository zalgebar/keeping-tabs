<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark light">
<!-- apple-mobile-web-app-capable + viewport-fit=cover is what makes iOS
     report real safe-area insets in standalone; without it env() reads 0.
     The status bar is deliberately NOT black-translucent: translucent moves
     the viewport origin up under the status bar without growing its height,
     leaving an unpaintable black band along the bottom. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Keeping Tabs</title>
<!-- Two marks, because they are read at different sizes. favicon.ico
     carries no letters: at 16px a glyph is four grey pixels. Everything a
     launcher shows is big enough for initials, so those come from
     ref/appicon.svg, which is also where icon-192 and icon-512 come from
     when the manifest lands (#25).

     PNG, not ICO or SVG, and this is the second attempt at #58. iPadOS
     Safari shows no favicon at all here - a derived "Z" in the tab bar, a
     globe in the bookmarks bar - while macOS Safari renders the same files
     correctly. Removing the SVG did not fix it, so the remaining format
     difference is the ICO itself. zalgebar.com serves a PNG through
     rel="shortcut icon" and works on the same device, so this mirrors that
     exactly rather than inventing a third arrangement. favicon.svg and
     favicon.ico stay in the repo as sources; neither is offered. -->
<link rel="icon" type="image/png" sizes="48x48" href="icon-48.png">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="shortcut icon" href="icon-32.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">

<!-- og:image must be absolute. A relative path silently fails on most
     scrapers, which is a common way for a card to look broken with nothing
     visibly wrong in the markup. preview-square.png ships alongside for the
     clients that crop to 1:1 rather than letterbox. -->
<meta name="description" content="A tabletop scorekeeper where every player gets a tab on their own edge of the screen, turned to face their seat.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://zalgebar.com/keeping-tabs/">
<meta property="og:title" content="Keeping Tabs">
<meta property="og:description" content="A tabletop scorekeeper where every player gets a tab on their own edge of the screen, turned to face their seat.">
<meta property="og:image" content="https://zalgebar.com/keeping-tabs/preview.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:image:alt" content="Two overlapping tabs on a dark ground: a blue one reading Keeping, a red one in front reading Tabs.">
<meta name="twitter:card" content="summary_large_image">

<link rel="stylesheet" href="app.css">
</head>
<body>

<div id="probe"></div>
<div id="vp"></div>
<div id="stage">
  <div id="scrim"></div>
</div>

<div id="center">
  <div class="hub">
    <h1>Keeping Tabs</h1>
    <div class="lead" id="lead"></div>
    <button class="btn" id="roundentry">Enter round</button>
    <button class="btn primary" id="endRound">End round</button>
    <div class="btns">
      <button class="btn" id="undo">Undo</button>
      <button class="btn" id="rounds">Rounds</button>
    </div>
    <div class="btns">
      <button class="btn" id="manage">Players</button>
      <button class="btn" id="game">Game</button>
    </div>
    <div class="seg" id="arrange">
      <button data-arrange="off" aria-pressed="true">Locked</button>
      <button data-arrange="on" aria-pressed="false">Arrange</button>
    </div>
    <button class="tiny" id="diagToggle"></button>
    <div class="diagbox" id="diagbox"></div>
  </div>
</div>

<div id="sheet"></div>
<div id="emopop"></div>
<script src="app.js"></script>
</body>
</html>
