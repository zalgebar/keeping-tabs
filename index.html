<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="color-scheme" content="dark light">
<!-- apple-mobile-web-app-capable + viewport-fit=cover is what makes iOS
     report real safe-area insets in standalone; without it env() reads 0.
     The status bar is deliberately NOT black-translucent: translucent moves
     the viewport origin up under the status bar without growing its height,
     so the page ends one top-inset short of the screen and leaves an
     unpaintable black band along the bottom. Opaque keeps the viewport
     below the status bar and running to the physical bottom, which is where
     the bleed is actually wanted. -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<title>Keeping Tabs — M1 perimeter prototype</title>
<style>
  /* ============================================================
     M1 · Perimeter prototype
     Throwaway. Its only job is to answer whether dragging a tab
     around the perimeter feels good. No persistence, fake data.
     ============================================================ */

  :root {
    --depth: 80px;
    --ground: #14181A;
    --ink: #E8EDEA;
    --ink-dim: #8C9A94;
    --hub: #1D2326;
    --rule: #2C3438;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0;
    height: 100%;
    overflow: hidden;
    overscroll-behavior: none;
    background: var(--ground);
    color: var(--ink);
    font: 15px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }

  /* probe for env() safe-area insets — read via computed padding */
  /* Measures what the page can actually paint. iOS standalone under-reports
     window.innerHeight by the top inset once the status bar is translucent,
     which left a black band along the bottom edge. A fixed inset:0 box is
     the layout viewport itself, so it cannot disagree with reality. */
  #vp { position: fixed; inset: 0; pointer-events: none; z-index: -2; }

  #probe {
    position: fixed; top: 0; left: 0; width: 1px; height: 1px;
    padding: env(safe-area-inset-top) env(safe-area-inset-right)
             env(safe-area-inset-bottom) env(safe-area-inset-left);
    opacity: 0; pointer-events: none; z-index: -1;
  }

  /* ---------- centre ---------- */

  #centre {
    position: fixed;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 14px;
    padding: 16px;
    text-align: center;
  }

  #centre .outline {
    position: absolute; inset: 0;
    border: 1px dashed var(--rule);
    border-radius: 8px;
    pointer-events: none;
  }

  .hub {
    background: var(--hub);
    border: 1px solid var(--rule);
    border-radius: 10px;
    padding: 14px 16px;
    display: flex; flex-direction: column; gap: 12px;
    min-width: 0;
    max-width: min(300px, 100%);
  }

  .hub h1 {
    margin: 0; font-size: 13px; font-weight: 600;
    letter-spacing: .14em; text-transform: uppercase;
    color: var(--ink-dim);
  }

  .row { display: flex; align-items: center; gap: 10px; justify-content: space-between; }
  /* three buttons will not fit beside a label at phone width */
  .row.stack { flex-direction: column; align-items: stretch; gap: 6px; }
  .row.stack label { text-align: left; }
  .row label { font-size: 13px; color: var(--ink-dim); }

  input[type=range] { flex: 1; min-width: 0; accent-color: #E08A4C; }

  .seg { display: flex; gap: 4px; }
  .seg button {
    flex: 1; padding: 6px 8px; font: inherit; font-size: 12px;
    background: #262E31; color: var(--ink-dim);
    border: 1px solid var(--rule); border-radius: 6px; cursor: pointer;
  }
  .seg button[aria-pressed="true"] { background: #E08A4C; color: #1A1005; border-color: #E08A4C; font-weight: 600; }
  .seg button:focus-visible { outline: 2px solid #E08A4C; outline-offset: 2px; }

  #readout {
    font: 11px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace;
    color: var(--ink-dim); white-space: pre; min-height: 3em;
  }

  .hint { font-size: 12px; color: var(--ink-dim); max-width: 30ch; }
  #centre > .hub { overflow: hidden; }

  /* ---------- tabs ---------- */

  #stage { position: fixed; inset: 0; pointer-events: none; }

  .tab {
    position: absolute; top: 0; left: 0;
    transform-origin: 0 0;
    height: var(--depth);
    pointer-events: auto;
    cursor: grab;
    color: #fff;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 1px;
    overflow: hidden;
    transition: box-shadow .18s ease, filter .18s ease;
    /* local y=0 is the INWARD edge, y=depth is the OUTER edge.
       Padding reserves both strips so content never collides with
       the inward bar or the outer star. */
    padding: 7px 0 17px;
  }

  /* straight sides, rounded inward corners */
  .tab { border-radius: 12px 12px 0 0; }

  /* Finish sits on an overlay, not on the tab's own box-shadow, which the
     lift state already owns. */
  .tab::after {
    content: ""; position: absolute; inset: 0;
    border-radius: inherit; pointer-events: none;
  }
  .tab.finish-bevel::after {
    box-shadow: inset 0 2px 0 rgba(255,255,255,.20),
                inset 2px 0 0 rgba(255,255,255,.07),
                inset -2px 0 0 rgba(0,0,0,.20);
  }
  .tab.finish-emboss::after {
    box-shadow: inset 0 1px 0 rgba(255,255,255,.16),
                inset 0 -1px 0 rgba(0,0,0,.28);
  }

  .tab.lifted { cursor: grabbing; filter: brightness(1.14); box-shadow: 0 0 0 2px #fff8, 0 8px 24px #0009; z-index: 10; }
  .tab.settling { transition: transform .22s cubic-bezier(.2,.9,.3,1), box-shadow .18s ease, filter .18s ease; }

  /* line-height 1 on both rows: inherited 1.4 makes them taller than
     they look and pushes content into the bar and star strips. */
  .tab .name { display: flex; align-items: baseline; gap: 5px; max-width: 100%; padding: 0 8px; line-height: 1; }
  .tab .emoji { font-size: 22px; line-height: 1; }
  .tab .who {
    font-size: 17px; font-weight: 600; letter-spacing: .01em;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .tab .nums { display: flex; align-items: baseline; gap: 4px; font-variant-numeric: tabular-nums; line-height: 1; }
  .tab .rnd { font-size: 16px; opacity: .78; }
  .tab .tot { font-size: 30px; font-weight: 700; letter-spacing: -.02em; }

  /* tier: hide pieces as length shrinks */
  .tab.t-first .who   { max-width: 8ch; }
  .tab.t-norounds .rnd { display: none; }
  .tab.t-emoji .who   { display: none; }
  .tab.t-emoji .emoji { font-size: 24px; }

  /* markers — visual placeholders, real behaviour is M3 (#18) */
  .tab .bar {
    position: absolute; top: 2px; left: 12%; right: 12%; height: 4px;
    border-radius: 2px; background: #FFD98A; display: none;
  }
  .tab.won-round .bar { display: block; }
  /* offset by the bleed so the star stays inside the safe area — the
     home indicator sits exactly where the bleed is. */
  .tab .star { position: absolute; bottom: calc(2px + var(--bleed, 0px)); font-size: 13px; line-height: 1; display: none; color: #FFD98A; }
  .tab.leading .star { display: block; }

  @media (prefers-reduced-motion: reduce) {
    .tab, .tab.settling { transition: none; }
  }
</style>
</head>
<body>

<div id="probe"></div>
<div id="vp"></div>
<div id="stage"></div>

<div id="centre">
  <div class="outline"></div>
  <div class="hub">
    <h1>M1 · Perimeter</h1>
    <div class="row">
      <label for="count">Players</label>
      <input id="count" type="range" min="2" max="16" value="6">
      <strong id="countVal" style="width:2ch;text-align:right">6</strong>
    </div>
    <div class="row stack">
      <label>Finish</label>
      <div class="seg" id="finish">
        <button data-finish="flat" aria-pressed="true">Flat</button>
        <button data-finish="bevel" aria-pressed="false">Bevel</button>
        <button data-finish="emboss" aria-pressed="false">Emboss</button>
      </div>
    </div>
    <div class="row">
      <label>Tabs</label>
      <div class="seg" id="arrange">
        <button data-arrange="off" aria-pressed="true">Locked</button>
        <button data-arrange="on" aria-pressed="false">Arrange</button>
      </div>
    </div>
    <p class="hint" id="hint">Locked: press and hold a tab to pick it up. Arrange: drag freely.</p>
    <div id="readout"></div>
  </div>
</div>

<script>
"use strict";

/* ============================================================
   Constants
   ============================================================ */

const DEPTH    = 80;   // how far a tab reaches in, measured from the SAFE edge
const PAD_IN   = 7;    // clear of the inward bar
const PAD_OUT  = 17;   // clear of the outer star
const GAP      = 6;    // between neighbours on the same edge
const MIN_LEN  = 60;   // floor; below this an edge is full
const MAX_LEN  = 200;
/* Tabs deliberately do NOT fill their edge. Sized to the full span they
   leave zero slack, so a neighbour can never visibly slide out of the
   way — it can only snap when the sort order flips, which reads as the
   push working in one direction and not the other. Holding ~8% back
   gives the shove somewhere to go. */
const FILL     = 0.92;
/* iOS standalone with an opaque status bar reports no bottom inset, yet the
   page still runs under the home indicator — it lands on the leader star and
   clips the total. The translucent status bar does report the inset, but it
   shifts the viewport up without growing it, leaving a dead band along the
   bottom. Opaque is the better trade, so the indicator clearance is supplied
   here instead. Values are Apple's own home-indicator insets. */
const HOME_BAR_PHONE  = 34;
const HOME_BAR_TABLET = 20;

const HOLD_MS  = 350;  // press-and-hold to lift, when locked
const SLOP     = 8;    // movement that cancels the hold

const EDGES = ["top", "right", "bottom", "left"];

/* Curated animal pool: distinct silhouettes, nothing newer than
   Unicode 9.0 so older devices render animals rather than tofu (#9). */
const ANIMALS = ["🦊","🐙","🦉","🐢","🐧","🦋","🐝","🐌","🦈","🦇","🐘","🐳",
                 "🦀","🦑","🐊","🐍","🦂","🦅","🐪","🦏","🐸","🦔","🦕","🐇",
                 "🦎","🐟"];

const NAMES = ["Ann Torres","Rai Okonkwo","Bo Lindqvist","Kit Marchetti",
               "Sam Delacroix","Mo Farrukh","Jo Van Aken","Wren Castellanos",
               "Dev Ramanathan","Ida Bjørnstad","Tam Nakagawa","Zev Abramowicz",
               "Lux Oyelaran","Ola Kowalczyk","Pim Vandenberg","Ric Santamaria"];

const COLORS = ["#B3591F","#43489B","#1E5C46","#A02F2C","#6B4C9A","#0F6E77",
                "#8A6D1F","#2F5FA8","#7A3B6B","#3E6B2A","#A34A2E","#245C86",
                "#6E3A8C","#186B58","#8E4A1E","#4A4E8F"];

/* ============================================================
   State
   ============================================================ */

let players = [];
let arrangeMode = false;
let finish = "flat";        // flat | bevel | emboss
let safe = { top: 0, right: 0, bottom: 0, left: 0 };

const stage    = document.getElementById("stage");
const vpEl     = document.getElementById("vp");
const centre   = document.getElementById("centre");
const readout  = document.getElementById("readout");
const probe    = document.getElementById("probe");

/* ============================================================
   Geometry
   ============================================================ */

/* Never window.innerWidth/innerHeight — see #vp above. */
function viewport() {
  const r = vpEl.getBoundingClientRect();
  return { w: r.width  || window.innerWidth,
           h: r.height || window.innerHeight };
}

function readSafeInsets() {
  const cs = getComputedStyle(probe);
  safe = {
    top:    parseFloat(cs.paddingTop)    || 0,
    right:  parseFloat(cs.paddingRight)  || 0,
    bottom: parseFloat(cs.paddingBottom) || 0,
    left:   parseFloat(cs.paddingLeft)   || 0
  };
}

/* The rect tabs anchor to: the viewport inset by the safe area, so a
   tab is never under the home indicator or the notch (#5). */
function safeRect() {
  const v = viewport();
  return {
    l: bleedFor("left"),
    t: bleedFor("top"),
    r: v.w - bleedFor("right"),
    b: v.h - bleedFor("bottom")
  };
}

function edgeLength(edge, rect) {
  return (edge === "top" || edge === "bottom") ? rect.r - rect.l : rect.b - rect.t;
}

/* Usable span excludes one tab-depth at each end, so nothing lands in
   a corner where two edges would collide (#4). */
function edgeSpan(edge, rect) {
  const len = edgeLength(edge, rect);
  const start = (edge === "top" || edge === "bottom") ? rect.l : rect.t;
  return { start: start + DEPTH, length: Math.max(0, len - DEPTH * 2) };
}

function edgeCapacity(edge, rect) {
  const span = edgeSpan(edge, rect).length;
  return Math.max(0, Math.floor((span + GAP) / (MIN_LEN + GAP)));
}

/* ------------------------------------------------------------
   The four transforms.

   A tab is authored as one `length x DEPTH` box with upright text.
   Placement is a single translate+rotate, so there is no per-edge
   markup and no swapping width for height on the vertical edges (#2).

   In local coordinates y=0 is ALWAYS the inward edge and y=DEPTH the
   outer edge, on all four sides. That invariant is what lets the
   last-round bar and the leader star sit on fixed local edges.
   ------------------------------------------------------------ */
/* Total depth for an edge: DEPTH inward of the safe boundary, plus the
   safe-area inset as bleed. Tabs anchor to the PHYSICAL screen edge so
   they look attached rather than hovering above a letterboxed strip —
   the background runs to the bezel while content stays inside the safe
   area, clear of the home indicator. */
function isStandalone() {
  return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) ||
         navigator.standalone === true;
}

/* Effective bleed for an edge: what the browser reports, or our own
   home-indicator clearance where it reports nothing but the bar is there. */
function bleedFor(edge) {
  const reported = safe[edge] || 0;
  if (reported === 0 && edge === "bottom" && isStandalone()) {
    return Math.min(screen.width, screen.height) >= 600 ? HOME_BAR_TABLET : HOME_BAR_PHONE;
  }
  return reported;
}

function edgeDepth(edge) { return DEPTH + bleedFor(edge); }

function tabTransform(edge, along, len) {
  const v = viewport();
  const W = v.w, H = v.h;
  const D = edgeDepth(edge);
  switch (edge) {
    case "bottom": return `translate(${along}px, ${H - D}px) rotate(0deg)`;
    case "top":    return `translate(${along + len}px, ${D}px) rotate(180deg)`;
    case "left":   return `translate(${D}px, ${along}px) rotate(90deg)`;
    case "right":  return `translate(${W - D}px, ${along + len}px) rotate(-90deg)`;
  }
}

/* ============================================================
   Layout — pack each edge, then place
   ============================================================ */

/* `commit` writes resolved positions back to each tab's fraction.
   During a drag it stays false: neighbours are shoved only visually, so
   moving away lets them spring home. Committing every frame instead
   makes each shove the tab's new home, and it can be pushed for ever. */
function layout(commit = false) {
  const rect = safeRect();

  spillOverfullEdges(rect);

  for (const edge of EDGES) {
    const span = edgeSpan(edge, rect);
    const group = players.filter(p => p.edge === edge).sort((a, b) => a.fraction - b.fraction);
    const n = group.length;
    if (!n) continue;

    // Length shrinks with crowding, down to the floor, and stops short
    // of filling the edge so there is always room to push into.
    const ideal = (span.length * FILL - GAP * (n - 1)) / n;
    const len = Math.max(MIN_LEN, Math.min(MAX_LEN, ideal));

    // Desired centres from each tab's stored fraction.
    const half = len / 2;
    const lo = span.start + half;
    const hi = span.start + span.length - half;
    const pitch = len + GAP;
    const centres = group.map(p => clamp(span.start + p.fraction * span.length, lo, hi));

    // Relaxation. The dragged tab is PINNED and neighbours are pushed
    // away from it in both directions, so it holds the spot the finger
    // chose. Relaxing from index 0 instead makes the shove one-sided:
    // approaching a neighbour from its right displaces the dragged tab
    // rather than the neighbour.
    const pin = group.findIndex(p => p.lifted);

    if (pin >= 0) {
      for (let i = pin + 1; i < n; i++) centres[i] = Math.max(centres[i], centres[i - 1] + pitch);
      for (let i = pin - 1; i >= 0; i--) centres[i] = Math.min(centres[i], centres[i + 1] - pitch);
    } else {
      for (let i = 1; i < n; i++) centres[i] = Math.max(centres[i], centres[i - 1] + pitch);
      for (let i = n - 2; i >= 0; i--) centres[i] = Math.min(centres[i], centres[i + 1] - pitch);
    }

    // Only the ends may override the pin, and only once the edge has
    // genuinely run out of room. Running these unconditionally is what
    // made a leftward drag snap the moving tab instead of shoving the
    // resident one.
    if (centres[0] < lo) {
      centres[0] = lo;
      for (let i = 1; i < n; i++) centres[i] = Math.max(centres[i], centres[i - 1] + pitch);
    }
    if (centres[n - 1] > hi) {
      centres[n - 1] = hi;
      for (let i = n - 2; i >= 0; i--) centres[i] = Math.min(centres[i], centres[i + 1] - pitch);
    }

    group.forEach((p, i) => {
      const c = clamp(centres[i], lo, hi);
      p._len = len;
      p._along = c - half;
      p._transform = tabTransform(edge, p._along, len);
      // Displacement becomes real only on drop. Until then `fraction`
      // is left alone, so every frame re-derives the shove from the
      // original positions rather than from the last shoved ones.
      if (commit && span.length > 0) {
        p.fraction = clamp((c - span.start) / span.length, 0, 1);
      }
    });
  }

  render(rect);
}

/* If an edge holds more tabs than it can fit at the floor, move the
   excess to the emptiest edge rather than overlapping them. */
function spillOverfullEdges(rect) {
  for (const edge of EDGES) {
    const cap = edgeCapacity(edge, rect);
    let group = players.filter(p => p.edge === edge).sort((a, b) => a.fraction - b.fraction);
    while (group.length > cap) {
      const target = EDGES
        .map(e => ({ e, room: edgeCapacity(e, rect) - players.filter(p => p.edge === e).length }))
        .sort((a, b) => b.room - a.room)[0];
      if (!target || target.room <= 0) break;
      const moved = group.pop();
      moved.edge = target.e;
      moved.fraction = 0.5;
    }
  }
}

const clamp = (v, a, b) => Math.max(a, Math.min(b, v));

/* ============================================================
   Render
   ============================================================ */

/* Thresholds scale with the type, which grew along with DEPTH. */
function tierFor(len) {
  if (len >= 150) return "";              // emoji + full name / round + total
  if (len >= 108) return "t-first";       // emoji + first name / round + total
  if (len >= 76)  return "t-first t-norounds";
  return "t-emoji t-norounds";            // emoji / total
}

function render(rect) {
  // Leader and last-round marks are placeholders here; the real rules
  // live in M3 (#18). Included so tab shape can be judged in context.
  const best = Math.max(...players.map(p => p.total));
  const hot  = Math.max(...players.map(p => p.round));

  for (const p of players) {
    const el = p.el;
    const bleed = bleedFor(p.edge);
    el.style.width = p._len + "px";
    el.style.height = (DEPTH + bleed) + "px";
    el.style.paddingBottom = (PAD_OUT + bleed) + "px";
    el.style.setProperty("--bleed", bleed + "px");
    el.style.transform = p._transform;
    // Transform is only allowed to animate when a tab stays on the same
    // edge. CSS interpolates the whole matrix, so transitioning across a
    // rotation change makes the tab spin and skew through intermediate
    // angles — visible on first paint, on spill, and on rotate. Sliding
    // along one edge is the only case where easing actually helps.
    const sameEdge = p._renderedEdge === p.edge;
    el.className = `tab finish-${finish} ${tierFor(p._len)}` +
                   (p.lifted ? " lifted" : (sameEdge ? " settling" : "")) +
                   (p.total === best ? " leading" : "") +
                   (p.round === hot  ? " won-round" : "");
    p._renderedEdge = p.edge;
    el.querySelector(".who").textContent = p._len >= 120 ? p.name : p.first;
  }

  // Centre is the viewport minus tab depth on every occupied edge.
  const occupied = e => players.some(p => p.edge === e);
  centre.style.left   = (rect.l + (occupied("left")   ? DEPTH : 0) + 10) + "px";
  centre.style.top    = (rect.t + (occupied("top")    ? DEPTH : 0) + 10) + "px";
  centre.style.width  = (rect.r - rect.l - (occupied("left") ? DEPTH : 0) - (occupied("right")  ? DEPTH : 0) - 20) + "px";
  centre.style.height = (rect.b - rect.t - (occupied("top")  ? DEPTH : 0) - (occupied("bottom") ? DEPTH : 0) - 20) + "px";
}

function buildTab(p) {
  const el = document.createElement("div");
  el.className = "tab";
  el.style.background = p.color;
  el.innerHTML =
    `<span class="bar"></span>` +
    `<span class="name"><span class="emoji">${p.emoji}</span><span class="who"></span></span>` +
    `<span class="nums"><span class="rnd">${p.round}</span><span class="tot">${p.total}</span></span>` +
    `<span class="star">★</span>`;
  el.addEventListener("pointerdown", e => onPointerDown(e, p));
  stage.appendChild(el);
  return el;
}

/* ============================================================
   Setup — auto-arrange proportionally to edge span
   ============================================================ */

function setCount(n) {
  stage.innerHTML = "";
  const rect = safeRect();

  // Allocate players to edges in proportion to usable span, not
  // round-robin: the long edges carry roughly 2.3x the short ones.
  const spans = EDGES.map(e => ({ e, span: edgeSpan(e, rect).length }));
  const total = spans.reduce((s, x) => s + x.span, 0) || 1;
  let alloc = spans.map(x => ({ e: x.e, exact: n * x.span / total }));
  let counts = alloc.map(a => ({ e: a.e, n: Math.floor(a.exact), rem: a.exact % 1 }));
  let left = n - counts.reduce((s, c) => s + c.n, 0);
  counts.sort((a, b) => b.rem - a.rem);
  for (let i = 0; i < left; i++) counts[i % counts.length].n++;

  players = [];
  let i = 0;
  for (const c of counts) {
    for (let k = 0; k < c.n; k++, i++) {
      const p = {
        id: i,
        name: NAMES[i % NAMES.length],
        first: NAMES[i % NAMES.length].split(" ")[0],
        emoji: ANIMALS[i % ANIMALS.length],
        color: COLORS[i % COLORS.length],
        total: 12 + ((i * 17) % 47),
        round: (i * 5) % 13,
        edge: c.e,
        fraction: (k + 0.5) / c.n,
        lifted: false
      };
      p.el = buildTab(p);
      players.push(p);
    }
  }
  layout(true);
  report();
}

/* ============================================================
   Drag — hold to lift, then project onto the nearest edge (#3)
   ============================================================ */

let drag = null;

function onPointerDown(e, p) {
  if (e.button !== undefined && e.button !== 0) return;
  e.preventDefault();
  p.el.setPointerCapture(e.pointerId);

  drag = {
    p, id: e.pointerId,
    x0: e.clientX, y0: e.clientY,
    active: false, moved: false,
    timer: null
  };

  if (arrangeMode) {
    lift(p);
  } else {
    // Locked: a deliberate hold is required, so nobody repositions a
    // tab by accident while trying to score.
    drag.timer = setTimeout(() => { if (drag) lift(p); }, HOLD_MS);
  }

  window.addEventListener("pointermove", onPointerMove);
  window.addEventListener("pointerup", onPointerUp);
  window.addEventListener("pointercancel", onPointerUp);
}

function lift(p) {
  if (!drag) return;
  drag.active = true;
  p.lifted = true;
  p.el.classList.add("lifted");
  p.el.classList.remove("settling");
  if (navigator.vibrate) navigator.vibrate(8);
}

function onPointerMove(e) {
  if (!drag || e.pointerId !== drag.id) return;
  const dx = e.clientX - drag.x0, dy = e.clientY - drag.y0;
  if (!drag.moved && Math.hypot(dx, dy) > SLOP) {
    drag.moved = true;
    if (!drag.active && drag.timer) { clearTimeout(drag.timer); drag.timer = null; }
  }
  if (!drag.active) return;

  const rect = safeRect();
  const { edge, fraction } = projectToEdge(e.clientX, e.clientY, rect);
  drag.p.edge = edge;
  drag.p.fraction = fraction;
  layout();
  report(drag.p);
}

function onPointerUp(e) {
  if (!drag || (e && e.pointerId !== drag.id)) return;
  if (drag.timer) clearTimeout(drag.timer);
  const p = drag.p;
  if (drag.active) {
    // Commit while the tab is still pinned, so what gets recorded is
    // exactly the arrangement on screen. Clearing `lifted` first would
    // re-run the unpinned relaxation and could shift things at the last
    // moment.
    layout(true);
    p.lifted = false;
    p.el.classList.remove("lifted");
    layout();
  } else if (!drag.moved) {
    // A tap. In the real app this opens the panel (M3, #14).
    p.el.animate(
      [{ filter: "brightness(1)" }, { filter: "brightness(1.5)" }, { filter: "brightness(1)" }],
      { duration: 260 }
    );
  }
  drag = null;
  report();
  window.removeEventListener("pointermove", onPointerMove);
  window.removeEventListener("pointerup", onPointerUp);
  window.removeEventListener("pointercancel", onPointerUp);
}

/* Nearest-edge projection: perpendicular distance to each of the four
   edges, take the minimum, then clamp along it to a fraction. */
function projectToEdge(x, y, rect) {
  const d = {
    top:    y - rect.t,
    bottom: rect.b - y,
    left:   x - rect.l,
    right:  rect.r - x
  };
  const edge = EDGES.reduce((best, e) => (d[e] < d[best] ? e : best), "top");
  const span = edgeSpan(edge, rect);
  const along = (edge === "top" || edge === "bottom") ? x : y;
  const f = span.length > 0 ? (along - span.start) / span.length : 0.5;
  return { edge, fraction: clamp(f, 0, 1) };
}

/* ============================================================
   Readout
   ============================================================ */

function report(p) {
  const rect = safeRect();
  const counts = EDGES.map(e => `${e[0].toUpperCase()}${players.filter(x => x.edge === e).length}`).join(" ");
  const lens = players.length ? Math.round(Math.min(...players.map(x => x._len || 0))) : 0;
  const insets = `${safe.top|0}/${safe.right|0}/${safe.bottom|0}/${safe.left|0}`;
  const standalone = (window.matchMedia && matchMedia("(display-mode: standalone)").matches) ||
                     navigator.standalone === true;
  readout.textContent =
    `${counts}   min ${lens}px\n` +
    `inset ${insets} -> ${EDGES.map(bleedFor).map(function(v){return v|0}).join("/")}  ${standalone ? "standalone" : "browser"}\n` +
    `vp ${Math.round(viewport().w)}×${Math.round(viewport().h)}  inner ${window.innerWidth}×${window.innerHeight}\n` +
    `screen ${screen.width}×${screen.height}\n` +
    (p ? `${p.first} → ${p.edge} ${p.fraction.toFixed(2)}` : "");
}

/* ============================================================
   Controls
   ============================================================ */

const countEl = document.getElementById("count");
const countVal = document.getElementById("countVal");
countEl.addEventListener("input", () => {
  countVal.textContent = countEl.value;
  setCount(+countEl.value);
});

document.getElementById("finish").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  finish = b.dataset.finish;
  [...e.currentTarget.children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  layout();
});

document.getElementById("arrange").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  arrangeMode = b.dataset.arrange === "on";
  [...e.currentTarget.children].forEach(c => c.setAttribute("aria-pressed", String(c === b)));
  document.getElementById("hint").textContent = arrangeMode
    ? "Arrange: drag a tab straight to any edge."
    : "Locked: press and hold a tab to pick it up.";
});

let resizeTimer;
window.addEventListener("resize", () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => { readSafeInsets(); layout(true); report(); }, 80);
});
window.addEventListener("orientationchange", () => setTimeout(() => { readSafeInsets(); layout(true); report(); }, 250));

readSafeInsets();
setCount(+countEl.value);
</script>
</body>
